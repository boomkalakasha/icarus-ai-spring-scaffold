name: Feature request
description: Propose a focused improvement to the public generator
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Please keep proposals within the public generator scope. Do not attach private configuration or customer material.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the smallest behavior and public contract that would help.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
